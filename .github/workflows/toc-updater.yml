name: Update TOC Interface version(s)

on:
  schedule:
    - cron: "0 * * * *"
    # Weekly keepalive (see keepalive job)
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: toc-updater
  cancel-in-progress: false

jobs:
  # GitHub disables scheduled workflows in public repos after 60 days without
  # repository activity. Re-enabling via the API resets that timer.
  keepalive:
    if: github.event.schedule == '30 0 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Reset inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPOSITORY/actions/workflows/toc-updater.yml/enable"

  # Expansions, TOC files and PR content are configured in .github/toc-updater/.
  toc-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Clone Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Snapshot interface values
        id: before
        run: python3 .github/toc-updater/toc_updater.py before

      - name: Update TOC Interface Versions
        uses: p3lim/toc-interface-updater@b39657008063f1ea2d839d40d528048e29a0b096 # v4.17
        with:
          flavor: ${{ steps.before.outputs.flavors }}
          beta: false
          ptr: false

      - name: Build changelog and PR content
        id: after
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/toc-updater/toc_updater.py after

      - name: Create Pull Request
        if: steps.after.outputs.create == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          title: ${{ steps.after.outputs.version }}
          commit-message: Update TOC Interface versions - ${{ steps.after.outputs.branch }}
          branch: ${{ steps.after.outputs.branch }}
          body-path: ${{ steps.after.outputs.body_path }}
          assignees: davie3
          # NOTE: Add "mainline" label back if retail is re-enabled
          labels: |
            compatibility
            classic
          delete-branch: true
